artifacts = [{ source = "/state/trustval.db", service = "trustval-api" }]
schema_version = "1.4"
[task]
name = "trustval/stale-read"
description = "Verify a role grant when immediate reads may be stale."
authors = [{ name = "TrustVal" }]
[metadata]
category = "agent-reliability"
difficulty = "medium"
[environment]
network_mode = "public"
cpus = 1
memory_mb = 1024
storage_mb = 2048
[agent]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "trustval-api"]
timeout_sec = 300.0
user = "root"
[verifier]
timeout_sec = 60.0
user = "root"
network_mode = "no-network"
environment_mode = "separate"

services:
  main:
    depends_on:
      trustval-api:
        condition: service_healthy
  trustval-api:
    build:
      context: ./state_service
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
